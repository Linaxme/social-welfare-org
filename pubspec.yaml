name: somiti_app
description: "Somiti - সংগঠনের হিসাব ও ডোনেশন ম্যানেজমেন্ট"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  fl_chart: ^0.71.0
  intl: ^0.20.2
  google_fonts: ^6.2.1
  pdf: ^3.11.3
  printing: ^5.14.2
  excel: ^4.0.6
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  cross_file: ^0.3.4+2
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  cloud_functions: ^6.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  image_path: "app_icon.png"
  android: true
  ios: true
  web:
    generate: true
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/
